#
name: Docker build

# This workflow builds the container image locally on the runner.
# It does not publish to any registry.
on:
  workflow_dispatch:
env:
  IMAGE_NAME: amidesk-api-server
#
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      #
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
